name: keepalive

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping backend
        env:
          URL: ${{ vars.DEMO_BACKEND_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "variavel DEMO_BACKEND_URL nao definida, pulando"
            exit 0
          fi
          curl -sf --max-time 120 "$URL/health" && echo "backend acordado"
