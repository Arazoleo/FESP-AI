version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fesp-ai-backend
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_db_unifesp:/app/chroma_db_unifesp
      - ./jsons_disciplinas:/app/jsons_disciplinas
      - ./jsons_regimentos:/app/jsons_regimentos
    environment:
      # Conecta ao Ollama rodando nativamente no Mac (com Metal)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
      - PYTHONWARNINGS=ignore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fesp-ai-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fesp-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    networks:
      - fesp-ai-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  fesp-ai-network:
    driver: bridge
